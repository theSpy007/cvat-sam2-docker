# nginx.conf for cvat-sam2 proxy
# Routes requests to CVAT server and UI containers.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Increase for large annotation uploads / video
    client_max_body_size 8G;

    upstream cvat_server {
        server cvat_server:8080;
    }

    upstream cvat_ui {
        server cvat_ui:80;
    }

    server {
        listen 80;
        server_name _;

        # API and admin
        location /api/ {
            proxy_pass http://cvat_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
        }

        location /admin {
            proxy_pass http://cvat_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /django-static/ {
            proxy_pass http://cvat_server;
        }

        location /data/ {
            proxy_pass http://cvat_server;
            proxy_read_timeout 300s;
        }

        # WebSocket for CVAT
        location /ws/ {
            proxy_pass http://cvat_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Frontend
        location / {
            proxy_pass http://cvat_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
