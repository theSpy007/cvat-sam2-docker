# =============================================================
# docker-compose.yml — Base CVAT + SAM2 + ONNX runner stack
# =============================================================
# This is the primary compose file. Additional override files
# are applied by the ./cvat-sam2 CLI script:
#   docker-compose.gpu.yml  — adds GPU resources
#   docker-compose.serverless.yml — adds Nuclio serverless
#
# Do NOT run docker compose directly; use ./cvat-sam2 instead.
# =============================================================

x-restart-policy: &restart_policy
  restart: unless-stopped

x-log-opts: &log_opts
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

# Shared CVAT environment — used by server and all workers
x-cvat-env: &cvat_env
  DJANGO_MODWSGI_EXTRA_ARGS: ""
  # Explicit list + wildcard — handles both internal Docker DNS and browser
  ALLOWED_HOSTS: "localhost,cvat-server,cvat_server,*"
  # Public-facing URL — used by local settings to populate CSRF_TRUSTED_ORIGINS
  CVAT_BASE_URL: "http://localhost:${CVAT_PORT:-8080}"
  # Load local settings override that sets CSRF_TRUSTED_ORIGINS from CVAT_BASE_URL
  DJANGO_SETTINGS_MODULE: "cvat.settings.local"
  CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
  CVAT_REDIS_INMEM_PORT: "6379"
  CVAT_REDIS_INMEM_PASSWORD: ""
  CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
  CVAT_REDIS_ONDISK_PORT: "6379"
  CVAT_POSTGRES_HOST: cvat_db
  CVAT_POSTGRES_DBNAME: ${POSTGRES_DB:-cvat}
  CVAT_POSTGRES_USER: ${POSTGRES_USER:-root}
  CVAT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvat_db_password_change_me}
  NUMPROCS: 1
  SMOKESCREEN_OPTS: ""
  IAM_OPA_HOST: "http://opa:8181"
  IAM_OPA_BUNDLE: "1"
  # Enable the MODELS plugin so CVAT's frontend shows the AI tools / magic wand.
  # Without this, GET /api/server/plugins returns MODELS:false and the wand is hidden.
  CVAT_SERVERLESS: "1"
  # Nuclio proxy — tells the django lambda gateway where to reach nuclio-proxy
  CVAT_NUCLIO_HOST: "nuclio"
  CVAT_NUCLIO_PORT: "8070"

services:
  # -----------------------------------------------------------
  # PostgreSQL database for CVAT
  # -----------------------------------------------------------
  cvat_db:
    image: postgres:15-alpine
    <<: [*restart_policy, *log_opts]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cvat}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvat_db_password_change_me}
    volumes:
      - cvat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-cvat}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cvat_network

  # -----------------------------------------------------------
  # Redis — cache/queue for CVAT
  # -----------------------------------------------------------
  cvat_redis_inmem:
    image: redis:7-alpine
    <<: [*restart_policy, *log_opts]
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cvat_network

  cvat_redis_ondisk:
    image: redis:7-alpine
    <<: [*restart_policy, *log_opts]
    command: redis-server --appendonly yes
    volumes:
      - cvat_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cvat_network

  # -----------------------------------------------------------
  # One-time migration init — runs `manage.py migrate` and exits
  # cvat_server waits for this to complete successfully
  # -----------------------------------------------------------
  cvat_server_init:
    image: cvat/server:${CVAT_VERSION:-v2.20.0}
    command: init
    restart: "no"
    depends_on:
      cvat_db:
        condition: service_healthy
      cvat_redis_inmem:
        condition: service_healthy
      cvat_redis_ondisk:
        condition: service_healthy
    environment:
      <<: *cvat_env
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./compose/cvat_local_settings.py:/home/django/cvat/settings/local.py:ro
    networks:
      - cvat_network

  # -----------------------------------------------------------
  # Open Policy Agent — CVAT IAM authorization engine
  # -----------------------------------------------------------
  opa:
    image: openpolicyagent/opa:latest
    <<: [*restart_policy, *log_opts]
    command:
      - run
      - --server
      - --addr=:8181
      # cvat-server alias (hyphen) is RFC 1034/1035-valid; Django accepts it
      - --set=services.cvat.url=http://cvat-server:8080
      - --set=bundles.cvat.service=cvat
      - --set=bundles.cvat.resource=/api/auth/rules
      - --set=bundles.cvat.polling.min_delay_seconds=10
      - --set=bundles.cvat.polling.max_delay_seconds=60
    networks:
      - cvat_network

  # -----------------------------------------------------------
  # CVAT server (Django)
  # -----------------------------------------------------------
  cvat_server:
    image: cvat/server:${CVAT_VERSION:-v2.20.0}
    <<: [*restart_policy, *log_opts]
    command: run server
    depends_on:
      cvat_server_init:
        condition: service_completed_successfully
      cvat_db:
        condition: service_healthy
      cvat_redis_inmem:
        condition: service_healthy
      cvat_redis_ondisk:
        condition: service_healthy
    environment:
      <<: *cvat_env
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./compose/cvat_local_settings.py:/home/django/cvat/settings/local.py:ro
    # host.docker.internal → host gateway so that INVOKE_METHOD=direct can reach
    # the nuclio-proxy port that is exposed on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Alias so OPA (and others) can reach this container via an RFC-valid hostname
    networks:
      cvat_network:
        aliases:
          - cvat-server
    healthcheck:
      # Use Python (always available) to check TCP port — avoids curl dependency
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/server/about')\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # -----------------------------------------------------------
  # CVAT worker — background scheduler, notifications, cleaning
  # -----------------------------------------------------------
  cvat_worker_utils:
    image: cvat/server:${CVAT_VERSION:-v2.20.0}
    <<: [*restart_policy, *log_opts]
    depends_on:
      cvat_server:
        condition: service_healthy
    command: run utils
    environment:
      <<: *cvat_env
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./compose/cvat_local_settings.py:/home/django/cvat/settings/local.py:ro
    networks:
      - cvat_network

  # -----------------------------------------------------------
  # CVAT worker — annotation
  # -----------------------------------------------------------
  cvat_worker_annotation:
    image: cvat/server:${CVAT_VERSION:-v2.20.0}
    <<: [*restart_policy, *log_opts]
    depends_on:
      cvat_server:
        condition: service_healthy
    command: run worker.annotation
    environment:
      <<: *cvat_env
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./compose/cvat_local_settings.py:/home/django/cvat/settings/local.py:ro
    networks:
      - cvat_network

  # -----------------------------------------------------------
  # CVAT worker — export
  # -----------------------------------------------------------
  cvat_worker_export:
    image: cvat/server:${CVAT_VERSION:-v2.20.0}
    <<: [*restart_policy, *log_opts]
    depends_on:
      cvat_server:
        condition: service_healthy
    command: run worker.export
    environment:
      <<: *cvat_env
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./compose/cvat_local_settings.py:/home/django/cvat/settings/local.py:ro
    networks:
      - cvat_network

  # -----------------------------------------------------------
  # CVAT worker — import
  # -----------------------------------------------------------
  cvat_worker_import:
    image: cvat/server:${CVAT_VERSION:-v2.20.0}
    <<: [*restart_policy, *log_opts]
    depends_on:
      cvat_server:
        condition: service_healthy
    command: run worker.import
    environment:
      <<: *cvat_env
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./compose/cvat_local_settings.py:/home/django/cvat/settings/local.py:ro
    networks:
      - cvat_network

  # -----------------------------------------------------------
  # CVAT UI (React frontend served by Nginx)
  # -----------------------------------------------------------
  cvat_ui:
    image: cvat/ui:${CVAT_VERSION:-v2.20.0}
    <<: [*restart_policy, *log_opts]
    depends_on:
      - cvat_server
    networks:
      - cvat_network

  # -----------------------------------------------------------
  # Nginx reverse proxy — exposes CVAT on host port
  # -----------------------------------------------------------
  cvat_proxy:
    image: nginx:1.25-alpine
    <<: [*restart_policy, *log_opts]
    depends_on:
      - cvat_server
      - cvat_ui
    ports:
      - "127.0.0.1:${CVAT_PORT:-8080}:80"
    volumes:
      - ./compose/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cvat_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/server/about > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 150s

  # -----------------------------------------------------------
  # Nuclio proxy — exposes a minimal Nuclio API so CVAT can
  # discover the SAM2 interactor function.  Translates CVAT's
  # interactor request format to our SAM2 service and returns
  # polygon points.  Replaces a real Nuclio installation.
  # -----------------------------------------------------------
  nuclio:
    build:
      context: ./services/nuclio-proxy
      dockerfile: Dockerfile
    image: cvat-sam2/nuclio-proxy:latest
    <<: [*restart_policy, *log_opts]
    depends_on:
      sam2:
        condition: service_healthy
    environment:
      SAM2_HOST: sam2
      SAM2_PORT: "8000"
      PROXY_PORT: "8070"
      # CVAT calls host.docker.internal:<FUNCTION_HOST_PORT> for direct invoke.
      # This must match the host-side port mapping below.
      FUNCTION_HOST_PORT: "${NUCLIO_PORT:-8070}"
    ports:
      # Bind to 0.0.0.0 so CVAT can reach this via host.docker.internal on Linux.
      # The host-gateway IP is the Docker bridge address, not 127.0.0.1.
      - "${NUCLIO_PORT:-8070}:8070"
    networks:
      - cvat_network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8070/health')\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -----------------------------------------------------------
  # SAM2 assisted annotation service
  # -----------------------------------------------------------
  sam2:
    build:
      context: ./services/sam2
      dockerfile: Dockerfile
    image: cvat-sam2/sam2:latest
    <<: [*restart_policy, *log_opts]
    environment:
      SAM2_MODEL_ID: ${SAM2_MODEL_ID:-large}
      SAM2_DEVICE: ${SAM2_DEVICE:-auto}
      SAM2_MODEL_CACHE: ${SAM2_MODEL_CACHE:-/models/sam2_cache}
    volumes:
      - sam2_model_cache:/models/sam2_cache
    ports:
      - "127.0.0.1:${SAM2_PORT:-8000}:8000"
    networks:
      - cvat_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  # -----------------------------------------------------------
  # ONNX model runner for custom segmentation models
  # -----------------------------------------------------------
  onnx_runner:
    build:
      context: ./services/onnx-runner
      dockerfile: Dockerfile
    image: cvat-sam2/onnx-runner:latest
    <<: [*restart_policy, *log_opts]
    environment:
      ONNX_DEVICE: ${ONNX_DEVICE:-auto}
      ONNX_MODELS_DIR: ${ONNX_MODELS_DIR:-/models/user}
    volumes:
      - ./models:/models/user:ro
    ports:
      - "127.0.0.1:${ONNX_PORT:-8001}:8001"
    networks:
      - cvat_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  cvat_db_data:
  cvat_redis_data:
  cvat_data:
  cvat_keys:
  cvat_logs:
  sam2_model_cache:

networks:
  cvat_network:
    driver: bridge
