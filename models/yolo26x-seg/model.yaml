# =============================================================
# model.yaml — YOLO26x-seg ONNX instance segmentation model
# =============================================================
# Ultralytics YOLO26x-seg exported to ONNX with end-to-end NMS.
# Trained on COCO (80 classes), outputs instance segmentation masks.
#
# Model metadata (from ONNX graph):
#   Input:   'images'  [1, 3, 640, 640]  float32
#   Output0: 'output0' [1, 300, 38]
#            38 = x1, y1, x2, y2, conf, class_id, 32×mask_coefficients
#   Output1: 'output1' [1, 32, 160, 160]  — prototype masks
# =============================================================

# Human-readable model name (used in CVAT auto-annotation UI)
name: yolo26x-seg

# Version string (free-form)
version: "8.4.51"

# Optional description shown in model listing
description: >
  Ultralytics YOLO26x-seg instance segmentation model trained on COCO (80 classes).
  Exported to ONNX with end-to-end NMS; outputs bounding boxes + pixel masks.

# Task type: segmentation | detection | classification
task_type: segmentation

# ── ONNX model I/O ───────────────────────────────────────────────

# Primary input tensor
input_name: images

# Input tensor shape [batch, channels, height, width] (NCHW)
input_shape: [1, 3, 640, 640]

# Input data type: float32 | float16 | uint8
input_dtype: float32

# Primary output tensor (bbox + mask coefficients).
# The prototype mask tensor (output1) is fetched automatically for yolo_seg.
output_name: output0

# ── Preprocessing ─────────────────────────────────────────────────

preprocessing:
  resize: [640, 640]

  # YOLO models normalize only by pixel_scale — no mean/std subtraction.
  normalize_mean: null
  normalize_std: null

  pixel_scale: 255.0
  channel_order: RGB
  layout: NCHW

# ── Postprocessing ────────────────────────────────────────────────

postprocessing:
  # yolo_seg: reconstruct per-instance masks from mask coefficients × prototypes
  output_type: yolo_seg

  # Mask binarization threshold (applied after sigmoid on prototype product)
  mask_threshold: 0.5

  # sigmoid and softmax are applied internally by the yolo_seg postprocessor
  sigmoid: false
  softmax: false

# ── Thresholds ────────────────────────────────────────────────────

confidence_threshold: 0.5
nms_threshold: 0.4

# ── Labels ───────────────────────────────────────────────────────
# COCO 80 classes — must match label names in your CVAT task.

labels:
  - {id: 0,  name: person,          color: "#FF3838"}
  - {id: 1,  name: bicycle,         color: "#FF9D97"}
