# =============================================================
# model.yaml — YOLO26m ONNX detection model configuration
# =============================================================
# Ultralytics YOLO26m exported to ONNX with end-to-end NMS.
# Trained on COCO (80 classes).
#
# Model metadata (from ONNX graph):
#   Input:  'images'  [1, 3, 640, 640]  float32
#   Output: 'output0' [1, 300, 6]
#           6 values per detection: [x1, y1, x2, y2, conf, class_id]
# =============================================================

# Human-readable model name (used in CVAT auto-annotation UI)
name: yolo26x

# Version string (free-form)
version: "8.4.51"

# Optional description shown in model listing
description: >
  Ultralytics YOLO26x object detection model trained on COCO (80 classes).
  Exported to ONNX with end-to-end NMS; output shape [1, 300, 6].

# Task type: segmentation | detection | classification
task_type: detection

# ── ONNX model I/O ───────────────────────────────────────────────

# Name of the input tensor in the ONNX graph
input_name: images

# Input tensor shape [batch, channels, height, width] (NCHW)
input_shape: [1, 3, 640, 640]

# Input data type: float32 | float16 | uint8
input_dtype: float32

# Name of the output tensor in the ONNX graph
output_name: output0

# ── Preprocessing ─────────────────────────────────────────────────

preprocessing:
  # Resize input image to [height, width] before model input.
  # If null, uses the spatial dims from input_shape.
  resize: [640, 640]

  # YOLO models normalize only by pixel_scale — no mean/std subtraction.
  normalize_mean: null
  normalize_std: null

  # Divide raw pixel values [0-255] by this value
  pixel_scale: 255.0

  # Channel order expected by the model: RGB | BGR
  channel_order: RGB

  # Memory layout: NCHW (standard PyTorch) | NHWC (TensorFlow)
  layout: NCHW

# ── Postprocessing ────────────────────────────────────────────────

postprocessing:
  # Output type: mask | bbox | polygon
  output_type: bbox

  # Not applicable for detection output
  mask_threshold: 0.5

  # YOLO output does not require sigmoid or softmax
  sigmoid: false
  softmax: false

# ── Thresholds ────────────────────────────────────────────────────

# Minimum confidence score to keep a detection
confidence_threshold: 0.5

# NMS IoU threshold (NMS is baked into this end2end export)
nms_threshold: 0.4

# ── Labels ───────────────────────────────────────────────────────
# COCO 80 classes — must match label names in your CVAT task.

